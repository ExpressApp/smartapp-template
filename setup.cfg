[tool:pytest]
testpaths = tests
asyncio_mode=auto
addopts =
    --cov=app
    --no-cov-on-fail
    --cov-report term-missing

[coverage:run]
concurrency = thread,greenlet

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise NotImplemented

[mypy]
disallow_untyped_defs = True
strict_optional = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-loguru.*]
ignore_missing_imports = True

[mypy-mako.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-app.db.migrations.*]
ignore_errors = True

[mypy-app.api.endpoints.healthcheck]
ignore_missing_imports = True

[mypy-app.constants]
ignore_missing_imports = True

[mypy-app.settings]
ignore_missing_imports = True

[mypy-app.services.static_files]
ignore_errors = True
